name: Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Bağımlılıkları kur
        run: npm install
      - name: Kural testleri
        run: npm test
      - name: Oyunu derle
        run: npm run build
      - name: Android projesini oluştur
        run: |
          npx cap add android
          npx @capacitor/assets generate --android
          npx cap sync android
      - name: APK derle
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - name: APK'yı adlandır
        run: cp android/app/build/outputs/apk/debug/app-debug.apk cini-sancaklari.apk
      - uses: actions/upload-artifact@v4
        with:
          name: cini-sancaklari-apk
          path: cini-sancaklari.apk
      - name: İndirme sayfasını güncelle
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete son-surum --cleanup-tag --yes || true
          gh release create son-surum cini-sancaklari.apk --title "Çini Sancakları" --notes "Android için son sürüm (${GITHUB_SHA::7})." --target "$GITHUB_SHA"
